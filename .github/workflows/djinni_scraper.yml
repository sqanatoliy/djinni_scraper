name: Run Djinni Scraper Hourly

on:
  schedule:
    - cron: '15 * * * *'  # Запуск кожну годину
  workflow_dispatch:  # Можливість ручного запуску

concurrency:
  group: djinni-vacancy-crawler-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  run_scraper:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      R2_DB_OBJECT_KEY: production/vacancies.db

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Ensure AWS CLI is available
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          python -m pip install --upgrade awscli
        fi
        aws --version

    - name: Restore canonical SQLite state from Cloudflare R2
      id: vacancy-db-restore
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: "true"
      run: |
        set -euo pipefail
        mkdir -p runtime
        database_path=runtime/vacancies.db
        temporary_path=runtime/vacancies.db.download
        head_error="$(mktemp)"
        trap 'rm -f "$temporary_path" "$head_error"' EXIT

        aws s3api head-bucket \
          --bucket "$R2_BUCKET_NAME" \
          --endpoint-url "$R2_ENDPOINT_URL" \
          >/dev/null

        if aws s3api head-object \
          --bucket "$R2_BUCKET_NAME" \
          --key "$R2_DB_OBJECT_KEY" \
          --endpoint-url "$R2_ENDPOINT_URL" \
          >/dev/null 2>"$head_error"; then
          aws s3 cp \
            "s3://$R2_BUCKET_NAME/$R2_DB_OBJECT_KEY" \
            "$temporary_path" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --only-show-errors
          python scripts/validate_sqlite_state.py --allow-supported-schema "$temporary_path"
          mv "$temporary_path" "$database_path"
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Restored SQLite state from Cloudflare R2."
        else
          status=$?
          if grep -Eq 'NoSuchKey|404|Not Found' "$head_error"; then
            if [[ -e "$database_path" ]]; then
              echo "R2 state object is absent while local SQLite state exists; refusing unsafe bootstrap." >&2
              exit 1
            fi
            echo "R2 state object not found; starting with a fresh database"
            echo "restored=false" >> "$GITHUB_OUTPUT"
          else
            echo "R2 state-object probe failed; refusing to bootstrap a fresh database." >&2
            exit "$status"
          fi
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests

    - name: Install Playwright dependencies
      run: |
        playwright install chromium

    - name: Wait before starting scraper (Cloudflare mitigation)
      run: sleep 5

    - name: Confirm crawler prerequisites
      id: crawler-prerequisites
      run: echo "ready=true" >> "$GITHUB_OUTPUT"

    - name: Run Djinni scraper for PYTHON jobs
      id: crawl-python
      if: always() && steps.crawler-prerequisites.outputs.ready == 'true'
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        python scripts/run_djinni_profile.py --profile python

    - name: Run Djinni scraper for DATA Engineering jobs
      id: crawl-data-engineer
      if: always() && steps.crawler-prerequisites.outputs.ready == 'true'
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        python scripts/run_djinni_profile.py --profile data_engineer

    - name: Run Djinni scraper for OTHER category jobs
      id: crawl-other
      if: always() && steps.crawler-prerequisites.outputs.ready == 'true'
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        python scripts/run_djinni_profile.py --profile other

    - name: Run Djinni scraper for SUPPORT jobs
      id: crawl-support
      if: always() && steps.crawler-prerequisites.outputs.ready == 'true'
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        python scripts/run_djinni_profile.py --profile support

    - name: Validate canonical SQLite state
      id: vacancy-db-state
      if: always()
      env:
        DB_PATH: ./runtime/vacancies.db
      run: |
        if python scripts/validate_sqlite_state.py --require-current-schema "$DB_PATH"; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Decide whether canonical SQLite state may be persisted
      id: vacancy-db-crawl
      if: always()
      env:
        RESTORED: ${{ steps.vacancy-db-restore.outputs.restored }}
        PYTHON_SUCCESS: ${{ steps.crawl-python.outputs.success }}
        DATA_ENGINEER_SUCCESS: ${{ steps.crawl-data-engineer.outputs.success }}
        OTHER_SUCCESS: ${{ steps.crawl-other.outputs.success }}
        SUPPORT_SUCCESS: ${{ steps.crawl-support.outputs.success }}
        PYTHON_MUTATED: ${{ steps.crawl-python.outputs.state_mutated }}
        DATA_ENGINEER_MUTATED: ${{ steps.crawl-data-engineer.outputs.state_mutated }}
        OTHER_MUTATED: ${{ steps.crawl-other.outputs.state_mutated }}
        SUPPORT_MUTATED: ${{ steps.crawl-support.outputs.state_mutated }}
      run: |
        set -euo pipefail
        successful_profiles=0
        mutated_profiles=0
        for outcome in "$PYTHON_SUCCESS" "$DATA_ENGINEER_SUCCESS" "$OTHER_SUCCESS" "$SUPPORT_SUCCESS"; do
          if [[ "$outcome" == "true" ]]; then
            successful_profiles=$((successful_profiles + 1))
          fi
        done
        for mutation in "$PYTHON_MUTATED" "$DATA_ENGINEER_MUTATED" "$OTHER_MUTATED" "$SUPPORT_MUTATED"; do
          if [[ "$mutation" == "true" ]]; then
            mutated_profiles=$((mutated_profiles + 1))
          fi
        done

        upload=false
        if [[ "$successful_profiles" -gt 0 && ( "$RESTORED" != "true" || "$mutated_profiles" -gt 0 ) ]]; then
          upload=true
        fi

        echo "successful_profiles=$successful_profiles" >> "$GITHUB_OUTPUT"
        echo "mutated_profiles=$mutated_profiles" >> "$GITHUB_OUTPUT"
        echo "upload=$upload" >> "$GITHUB_OUTPUT"
        echo "SQLite persistence decision: restored=$RESTORED successful_profiles=$successful_profiles mutated_profiles=$mutated_profiles upload=$upload"

    - name: Persist canonical SQLite state to Cloudflare R2
      if: always() && steps.vacancy-db-crawl.outputs.upload == 'true' && steps.vacancy-db-state.outputs.valid == 'true'
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: "true"
      run: |
        set -euo pipefail
        aws s3 cp \
          ./runtime/vacancies.db \
          "s3://$R2_BUCKET_NAME/$R2_DB_OBJECT_KEY" \
          --endpoint-url "$R2_ENDPOINT_URL" \
          --only-show-errors

    - name: Fail workflow for unsuccessful Djinni profiles
      if: always()
      env:
        PYTHON_SUCCESS: ${{ steps.crawl-python.outputs.success }}
        DATA_ENGINEER_SUCCESS: ${{ steps.crawl-data-engineer.outputs.success }}
        OTHER_SUCCESS: ${{ steps.crawl-other.outputs.success }}
        SUPPORT_SUCCESS: ${{ steps.crawl-support.outputs.success }}
      run: |
        set -euo pipefail
        failed_profiles=()
        for profile in python data_engineer other support; do
          success_var="$(echo "$profile" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_SUCCESS"
          if [[ "${!success_var}" != "true" ]]; then
            failed_profiles+=("$profile")
          fi
        done
        if [[ "${#failed_profiles[@]}" -gt 0 ]]; then
          echo "Djinni profile runner failed or did not publish a successful outcome: ${failed_profiles[*]}" >&2
          exit 2
        fi
