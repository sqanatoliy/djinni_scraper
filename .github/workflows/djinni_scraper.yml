name: Run Djinni Scraper Hourly

on:
  schedule:
    - cron: '15 * * * *'  # Запуск кожну годину
  workflow_dispatch:  # Можливість ручного запуску

concurrency:
  group: djinni-vacancy-crawler-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  run_scraper:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Restore canonical SQLite state
      id: vacancy-db-restore
      uses: actions/cache/restore@v4
      with:
        path: runtime/vacancies.db
        key: djinni-vacancies-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          djinni-vacancies-db-v1-

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests

    - name: Install Playwright dependencies
      run: |
        playwright install chromium

    - name: Wait before starting scraper (Cloudflare mitigation)
      run: sleep 5

    - name: Run Djinni scraper for PYTHON jobs
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        scrapy crawl djinni -a profile=python

    - name: Run Djinni scraper for DATA Engineering jobs
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        scrapy crawl djinni -a profile=data_engineer

    - name: Run Djinni scraper for OTHER category jobs
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        scrapy crawl djinni -a profile=other

    - name: Run Djinni scraper for SUPPORT jobs
      env:
        DB_PATH: ./runtime/vacancies.db
        DJINNI_EMAIL: ${{ secrets.DJINNI_EMAIL }}
        DJINNI_PASSWORD: ${{ secrets.DJINNI_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        NO_EXP_TELEGRAM_TOKEN: ${{ secrets.NO_EXP_TELEGRAM_TOKEN }}
        NO_EXP_CHAT_ID: ${{ secrets.NO_EXP_CHAT_ID }}
      run: |
        scrapy crawl djinni -a profile=support

    - name: Validate canonical SQLite state
      id: vacancy-db-state
      if: always()
      env:
        DB_PATH: ./runtime/vacancies.db
      run: |
        python - "$DB_PATH" <<'PY'
        import os
        import sqlite3
        import sys
        from pathlib import Path

        database_path = Path(sys.argv[1]).resolve()
        is_valid = False
        try:
            with sqlite3.connect(f"{database_path.as_uri()}?mode=ro", uri=True) as connection:
                quick_check = connection.execute("PRAGMA quick_check;").fetchone()
                schema_version = connection.execute("PRAGMA user_version;").fetchone()
                vacancies_table = connection.execute(
                    "SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'vacancies';"
                ).fetchone()
                outbox_table = connection.execute(
                    "SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'notification_outbox';"
                ).fetchone()
                is_valid = (
                    quick_check == ("ok",)
                    and schema_version == (3,)
                    and vacancies_table == (1,)
                    and outbox_table == (1,)
                )
        except (OSError, sqlite3.Error):
            pass

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"valid={'true' if is_valid else 'false'}\\n")
        PY

    - name: Save canonical SQLite state
      if: always() && steps.vacancy-db-state.outputs.valid == 'true'
      uses: actions/cache/save@v4
      with:
        path: runtime/vacancies.db
        key: ${{ steps.vacancy-db-restore.outputs.cache-primary-key }}
